<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nikita Musin — applied software developer</title>
  <desc id="desc">A dark editorial banner with a software system diagram and the phrase engineering useful software.</desc>

  <defs>
    <linearGradient id="background" x1="96" y1="26" x2="1120" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1425"/>
      <stop offset="0.58" stop-color="#080D18"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(964 96) rotate(135) scale(372 300)">
      <stop stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="limeGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(118 392) rotate(-26) scale(404 258)">
      <stop stop-color="#A3FF12" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#A3FF12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="737" y1="83" x2="1082" y2="335" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A3FF12"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="frameClip">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="420" fill="url(#background)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect width="1200" height="420" fill="url(#violetGlow)"/>
    <rect width="1200" height="420" fill="url(#limeGlow)"/>

    <path d="M688 0V420" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <path d="M92 355H616" stroke="#FFFFFF" stroke-opacity="0.09"/>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <circle cx="94" cy="72" r="5" fill="#A3FF12"/>
      <text x="112" y="78" fill="#C8D0E0" font-size="16" font-weight="700" letter-spacing="3">NIKITA MUSIN / TYUMEN</text>

      <text x="88" y="169" fill="#F8FAFC" font-size="61" font-weight="800" letter-spacing="-2">ENGINEERING</text>
      <text x="88" y="234" fill="#F8FAFC" font-size="61" font-weight="800" letter-spacing="-2">USEFUL SOFTWARE.</text>

      <text x="92" y="289" fill="#9AA7BC" font-size="20" font-weight="500">Backend systems · Desktop tools · Computer vision</text>

      <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700">
        <rect x="90" y="329" width="135" height="34" rx="17" fill="#A3FF12"/>
        <text x="112" y="351" fill="#070B14" letter-spacing="1">BUILD / 01</text>
        <rect x="237" y="329" width="159" height="34" rx="17" fill="#121A2B" stroke="#313C52"/>
        <text x="259" y="351" fill="#DCE3EF" letter-spacing="1">AUTOMATE / 02</text>
        <rect x="408" y="329" width="129" height="34" rx="17" fill="#121A2B" stroke="#313C52"/>
        <text x="430" y="351" fill="#DCE3EF" letter-spacing="1">SHIP / 03</text>
      </g>
    </g>

    <g>
      <circle cx="917" cy="210" r="128" stroke="#FFFFFF" stroke-opacity="0.05"/>
      <circle cx="917" cy="210" r="90" stroke="#FFFFFF" stroke-opacity="0.06" stroke-dasharray="5 7"/>
      <path d="M768 120L894 89L1054 137L1080 274L937 338L776 291L746 190L768 120Z" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <path d="M786 256L850 168L928 218L1000 135L1050 253" stroke="url(#line)" stroke-width="2.5"/>
      <path d="M850 168L1000 135M928 218L1050 253M786 256L928 218" stroke="#FFFFFF" stroke-opacity="0.11" stroke-dasharray="4 6"/>

      <circle cx="850" cy="168" r="28" fill="#0D1425" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="850" cy="168" r="7" fill="#8B5CF6"/>
      <circle cx="850" cy="168" r="15" fill="#8B5CF6" fill-opacity="0.22" filter="url(#softGlow)"/>

      <circle cx="928" cy="218" r="38" fill="#0D1425" stroke="#F8FAFC" stroke-opacity="0.75" stroke-width="2"/>
      <path d="M913 211H943M913 219H935M913 227H929" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>

      <circle cx="786" cy="256" r="22" fill="#0D1425" stroke="#61708A" stroke-width="2"/>
      <circle cx="786" cy="256" r="5" fill="#A3FF12"/>

      <circle cx="1000" cy="135" r="25" fill="#0D1425" stroke="#61708A" stroke-width="2"/>
      <path d="M990 135H1010M1000 125V145" stroke="#A3FF12" stroke-width="2.5" stroke-linecap="round"/>

      <circle cx="1050" cy="253" r="29" fill="#A3FF12"/>
      <path d="M1038 253L1046 261L1063 244" stroke="#070B14" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.5">
        <text x="748" y="104" fill="#7F8BA0">SYSTEM / ONLINE</text>
        <text x="824" y="126" fill="#A89BCB">INPUT</text>
        <text x="891" y="279" fill="#7F8BA0">PROCESS</text>
        <text x="1024" y="306" fill="#BEEB76">RESULT</text>
      </g>
    </g>

    <text x="1112" y="384" fill="#FFFFFF" fill-opacity="0.25" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" text-anchor="end" letter-spacing="2">NICKIHYSTERICS / 2026</text>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="27.25" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
</svg>
